<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Shift — Market-first strategy sim</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">MS</span>
        <div>
          <div class="brand-name">MARKET SHIFT</div>
          <div class="brand-sub">MARKET-FIRST STRATEGY SIM</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="pill" id="cash-pill">CUMULATIVE PROFIT <b id="cash">$ 0.00M</b></div>
        <div class="pill" id="round-pill">ROUND <b id="round-num">01</b> / <span id="round-total">06</span></div>
        <div class="pill screen-pill" id="screen-label">START MENU</div>
        <button class="ghost-btn" id="help-btn" type="button">HOW TO PLAY</button>
      </div>
    </header>

    <nav class="rail" aria-label="Round steps">
      <div class="rail-item" data-step="start"><span>OV</span></div>
      <div class="rail-item" data-step="scan"><span>MK</span></div>
      <div class="rail-item" data-step="lab"><span>CL</span></div>
      <div class="rail-item" data-step="compete"><span>$</span></div>
      <div class="rail-item" data-step="review"><span>FN</span></div>
    </nav>

    <main class="main">
      <ol class="steps" id="steps">
        <li data-step="start"><i>01</i> START</li>
        <li data-step="scan"><i>02</i> MARKETS</li>
        <li data-step="lab"><i>03</i> CHIP LAB</li>
        <li data-step="compete"><i>04</i> COMPETE</li>
        <li data-step="review"><i>05</i> REVIEW</li>
      </ol>
      <section id="screen" class="screen" aria-live="polite"></section>
    </main>

    <footer class="footer" id="footer"></footer>
  </div>

  <dialog id="help">
    <h2>How to play</h2>
    <div id="help-body"></div>
    <form method="dialog"><button class="primary-btn">GOT IT</button></form>
  </dialog>

  <script src="engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
